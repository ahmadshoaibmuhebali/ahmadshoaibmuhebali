<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="npmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="authentikGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="orderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="mgmtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">SERVER ARCHITECTURE DIAGRAM</text>
  <text x="600" y="70" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="500">Host IP: 94.156.189.247 | Docker Container Network Topology</text>

  <!-- External Client Box -->
  <rect x="450" y="95" width="300" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="122" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="600">🌐 Internet / Public Traffic</text>

  <!-- Connection: Public to Server Host -->
  <line x1="600" y1="140" x2="600" y2="175" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)"/>

  <!-- Host Server Container Box -->
  <rect x="40" y="180" width="1120" height="660" rx="16" fill="url(#hostGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="65" y="212" fill="#cbd5e1" font-size="15" font-weight="700" letter-spacing="1">DOCKER HOST (94.156.189.247)</text>

  <!-- Reverse Proxy Section -->
  <g id="nginx-proxy-manager">
    <rect x="70" y="235" width="1060" height="110" rx="12" fill="url(#npmGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="95" y="268" fill="#ffffff" font-size="18" font-weight="700">Nginx Proxy Manager</text>
    <text x="95" y="290" fill="#bae6fd" font-size="12">jc21/nginx-proxy-manager:latest • Container ID: 016dfe9be182</text>
    <text x="95" y="312" fill="#e0f2fe" font-size="12" font-weight="500">Exposed Ports: 0.0.0.0:80-81, 443 (TLS Termination &amp; Reverse Proxy Routing)</text>
  </g>

  <!-- Internal Bridge Network Label -->
  <line x1="70" y1="375" x2="1130" y2="375" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="600" y="370" text-anchor="middle" fill="#64748B" stroke="#0f172a" stroke-width="6" paint-order="stroke fill" font-size="12" font-weight="600">Docker Internal Bridge Network</text>

  <!-- Flows from NPM down to internal groups -->
  <line x1="240" y1="345" x2="240" y2="415" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="345" x2="600" y2="415" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="345" x2="960" y2="415" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- STACK 1: MANAGEMENT & UTILITIES -->
  <rect x="70" y="420" width="340" height="390" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="70" y="420" width="340" height="36" rx="12" fill="url(#mgmtGrad)"/>
  <text x="240" y="443" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">MANAGEMENT &amp; LDAP STACK</text>

  <!-- Portainer -->
  <rect x="85" y="470" width="310" height="140" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="495" fill="#fef3c7" font-size="15" font-weight="700">portainer</text>
  <text x="100" y="515" fill="#94a3b8" font-size="11">portainer/portainer-ce:latest</text>
  <text x="100" y="533" fill="#cbd5e1" font-size="11">ID: 280eda8e0b14</text>
  <line x1="100" y1="543" x2="385" y2="543" stroke="#334155" stroke-width="1"/>
  <text x="100" y="563" fill="#f59e0b" font-size="11" font-weight="600">Host Port: 0.0.0.0:9000 -> 9000</text>
  <text x="100" y="583" fill="#94a3b8" font-size="11">Internal Ports: 8000/tcp, 9443/tcp</text>

  <!-- LDAP Account Manager -->
  <rect x="85" y="630" width="310" height="150" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="655" fill="#fef3c7" font-size="15" font-weight="700">ldap_account_manager</text>
  <text x="100" y="675" fill="#94a3b8" font-size="11">ldapaccountmanager/lam:latest</text>
  <text x="100" y="693" fill="#cbd5e1" font-size="11">ID: 29c79d069ff3</text>
  <line x1="100" y1="705" x2="385" y2="705" stroke="#334155" stroke-width="1"/>
  <text x="100" y="725" fill="#10b981" font-size="11" font-weight="600">Internal Only: 80/tcp</text>
  <text x="100" y="745" fill="#94a3b8" font-size="11">Status: Up 2 weeks (healthy)</text>

  <!-- STACK 2: AUTHENTIK SSO STACK -->
  <rect x="430" y="420" width="340" height="390" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="430" y="420" width="340" height="36" rx="12" fill="url(#authentikGrad)"/>
  <text x="600" y="443" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">AUTHENTIK SSO STACK</text>

  <!-- Authentik Server -->
  <rect x="445" y="470" width="310" height="100" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="493" fill="#e0e7ff" font-size="15" font-weight="700">authentik-server-1</text>
  <text x="460" y="511" fill="#94a3b8" font-size="11">ghcr.io/goauthentik/server:2026.8.0</text>
  <line x1="460" y1="520" x2="740" y2="520" stroke="#334155" stroke-width="1"/>
  <text x="460" y="538" fill="#818cf8" font-size="11" font-weight="600">Ports: 9443->9443, 9010->9000</text>
  <text x="460" y="555" fill="#94a3b8" font-size="11">Status: Up 4 weeks (healthy)</text>

  <!-- Connection Server to Worker & DB -->
  <line x1="600" y1="570" x2="600" y2="585" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Authentik Worker -->
  <rect x="445" y="585" width="310" height="75" rx="8" fill="#0f172a" stroke="#4f46e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="608" fill="#e0e7ff" font-size="14" font-weight="700">authentik-worker-1</text>
  <text x="460" y="626" fill="#94a3b8" font-size="11">ghcr.io/goauthentik/server:2026.8.0</text>
  <text x="460" y="644" fill="#cbd5e1" font-size="11">Background Worker Process</text>

  <!-- Connection Worker to DB -->
  <line x1="600" y1="660" x2="600" y2="675" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Authentik PostgreSQL DB -->
  <rect x="445" y="675" width="310" height="105" rx="8" fill="url(#dbGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="698" fill="#a5b4fc" font-size="15" font-weight="700">authentik-postgresql-1</text>
  <text x="460" y="718" fill="#94a3b8" font-size="11">postgres:16-alpine</text>
  <line x1="460" y1="728" x2="740" y2="728" stroke="#334155" stroke-width="1"/>
  <text x="460" y="746" fill="#10b981" font-size="11" font-weight="600">Internal Port: 5432/tcp</text>
  <text x="460" y="764" fill="#94a3b8" font-size="11">Status: Up 4 weeks (healthy)</text>

  <!-- STACK 3: CUSTOM ORDER APP STACK -->
  <rect x="790" y="420" width="340" height="390" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="790" y="420" width="340" height="36" rx="12" fill="url(#orderGrad)"/>
  <text x="960" y="443" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">ORDER APP STACK</text>

  <!-- Order Web App -->
  <rect x="805" y="470" width="310" height="140" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="495" fill="#d1fae5" font-size="15" font-weight="700">order_app_web</text>
  <text x="820" y="515" fill="#94a3b8" font-size="11">cutomer-order-web</text>
  <text x="820" y="533" fill="#cbd5e1" font-size="11">ID: c9c3142362f4 • Gunicorn</text>
  <line x1="820" y1="543" x2="1105" y2="543" stroke="#334155" stroke-width="1"/>
  <text x="820" y="563" fill="#10b981" font-size="11" font-weight="600">Internal Port: 8000/tcp</text>
  <text x="820" y="583" fill="#94a3b8" font-size="11">Status: Up 5 weeks</text>

  <!-- Connection Web to DB -->
  <line x1="960" y1="610" x2="960" y2="630" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Order App DB -->
  <rect x="805" y="630" width="310" height="150" rx="8" fill="url(#dbGrad)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="655" fill="#a7f3d0" font-size="15" font-weight="700">order_app_db</text>
  <text x="820" y="675" fill="#94a3b8" font-size="11">postgres:15-alpine</text>
  <text x="820" y="693" fill="#cbd5e1" font-size="11">ID: 377aec4a28d1</text>
  <line x1="820" y1="705" x2="1105" y2="705" stroke="#334155" stroke-width="1"/>
  <text x="820" y="725" fill="#10b981" font-size="11" font-weight="600">Internal Port: 5432/tcp</text>
  <text x="820" y="745" fill="#94a3b8" font-size="11">Status: Up 5 weeks (healthy)</text>

</svg>
